<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="menu.wallet">Student Wallet</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <style>
    .wallet-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 800px) {
      .wallet-layout {
        grid-template-columns: 1fr 1fr;
      }
    }
    .wallet-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }
    .balance-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--brand);
      margin: 8px 0;
      font-variant-numeric: tabular-nums;
    }
    .amount-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }
    .amount-btn {
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .amount-btn.active {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
    }
    .payment-methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0; }
    .payment-method { display: grid; justify-items: start; gap: 4px; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-align: left; }
    .payment-method[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
    .payment-method:disabled { opacity: .58; }
    .payment-method small { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body data-role="student">
  <nav id="nav"></nav>
  <main>
    <header class="page-head">
      <h1 data-i18n="menu.wallet">Student Wallet</h1>
      <p class="muted" data-i18n="wallet.description"></p>
    </header>

    <div id="notice-container"></div>

    <div class="wallet-layout">
      <!-- Balance Card -->
      <div class="wallet-card">
        <span class="muted wallet-label" data-i18n="wallet.current"></span>
        <div class="balance-display" id="disp-balance">0 VND</div>
        <div style="display:flex; justify-content:space-between; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
          <div>
            <span class="muted" data-i18n="wallet.available"></span>
            <div class="wallet-available" id="disp-available">0 VND</div>
          </div>
          <div>
            <span class="muted" data-i18n="wallet.held"></span>
            <div class="wallet-held" id="disp-held">0 VND</div>
          </div>
        </div>
      </div>

      <!-- Top-up Card -->
      <div class="wallet-card">
        <h2 class="wallet-card-title" data-i18n="wallet.topUp"></h2>
        <p class="muted wallet-card-desc" data-i18n="wallet.topUpHelp"></p>
        <span class="wallet-input-label" data-i18n="wallet.payMethod"></span>
        <div id="payment-methods" class="payment-methods" role="group" aria-label="Payment method"></div>
        <div class="amount-chips">
          <button type="button" class="amount-btn active" data-val="50000">50,000 VND</button>
          <button type="button" class="amount-btn" data-val="100000">100,000 VND</button>
          <button type="button" class="amount-btn" data-val="200000">200,000 VND</button>
          <button type="button" class="amount-btn" data-val="500000">500,000 VND</button>
        </div>
        <div style="margin-bottom:16px;">
          <label class="wallet-input-label" for="inp-custom-amount" data-i18n="wallet.otherAmount"></label>
          <input type="number" id="inp-custom-amount" value="50000" min="10000" step="10000" style="width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink);">
        </div>
        <button id="btn-submit-topup" class="button" style="width:100%;">
          <i data-lucide="zap"></i> <span data-i18n="wallet.topUpButton"></span>
        </button>
      </div>
    </div>

    <!-- Transaction Ledger History -->
    <div class="card" style="margin-top:24px;">
      <h2 class="wallet-card-title" data-i18n="wallet.history"></h2>
      <div id="tx-history-container">
        <p class="muted" data-i18n="common.loading">Loading…</p>
      </div>
    </div>
  </main>

  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();

    let selectedAmount = 50000, lastTransactions = [], selectedMethod = 'demo';

    // Check if returned from mock checkout
    const urlParams = new URLSearchParams(window.location.search);
    let checkoutStatus = urlParams.get('checkout');
    function renderCheckoutNotice() {
      const notice = document.getElementById('notice-container');
      if (checkoutStatus === 'success') notice.innerHTML = `<div class="success-notice" role="status">${Hub.esc(Hub.t('wallet.paymentSuccess'))}</div>`;
      else if (checkoutStatus === 'failed') notice.innerHTML = `<div class="error wallet-notice" role="alert">${Hub.esc(Hub.t('wallet.paymentFailed'))}</div>`;
      else if (checkoutStatus === 'pending') notice.innerHTML = `<div class="checkout-note" role="status">${Hub.esc(Hub.t('wallet.paymentPending'))}</div>`;
      else notice.innerHTML = '';
    }
    renderCheckoutNotice();

    async function loadPaymentMethods() {
      const container = document.getElementById('payment-methods');
      try {
        const methods = await API.get('/api/wallet/payment-methods');
        const priority = ['vietqr', 'momo', 'demo'];
        const sorted = methods.sort((a, b) => priority.indexOf(a.id) - priority.indexOf(b.id));
        const firstReady = sorted.find(method => method.configured);
        if (firstReady) selectedMethod = firstReady.id;
        container.innerHTML = sorted.map(method => `<button type="button" class="payment-method" data-method="${Hub.esc(method.id)}" aria-pressed="${method.id === selectedMethod}" ${method.configured ? '' : 'disabled'}><b>${Hub.esc(Hub.t('wallet.provider.' + method.id))}</b><small>${Hub.esc(Hub.t(method.configured ? 'wallet.providerReady' : 'wallet.providerMissing'))}</small></button>`).join('');
        container.querySelectorAll('[data-method]').forEach(button => button.onclick = () => {
          selectedMethod = button.dataset.method;
          container.querySelectorAll('[data-method]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        });
        document.getElementById('btn-submit-topup').disabled = !firstReady;
      } catch (error) {
        container.textContent = Hub.t('wallet.methodsUnavailable');
        document.getElementById('btn-submit-topup').disabled = true;
      }
    }

    document.querySelectorAll('.amount-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAmount = parseInt(btn.dataset.val);
        document.getElementById('inp-custom-amount').value = selectedAmount;
      };
    });

    document.getElementById('inp-custom-amount').oninput = e => {
      selectedAmount = parseInt(e.target.value) || 0;
      document.querySelectorAll('.amount-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.val) === selectedAmount);
      });
    };

    async function loadWallet() {
      try {
        const wallet = await API.get('/api/wallet');
        document.getElementById('disp-balance').textContent = (wallet.balance || 0).toLocaleString() + ' VND';
        document.getElementById('disp-available').textContent = (wallet.available_balance || 0).toLocaleString() + ' VND';
        document.getElementById('disp-held').textContent = (wallet.held_deposit || 0).toLocaleString() + ' VND';

        const txs = await API.get('/api/wallet/transactions');
        lastTransactions = txs;
        renderTransactions(lastTransactions);
      } catch (err) {
        console.error(err);
      }
    }

    async function resolvePendingCheckout() {
      const orderId = urlParams.get('order_id');
      if (checkoutStatus !== 'pending' || !orderId) return;
      for (let i = 0; i < 20; i++) {
        try {
          const order = await API.get('/api/wallet/topup/' + encodeURIComponent(orderId));
          if (order.status === 'completed' || order.status === 'failed') {
            checkoutStatus = order.status === 'completed' ? 'success' : 'failed';
            renderCheckoutNotice(); loadWallet(); return;
          }
        } catch (_) { return; }
        await new Promise(resolve => setTimeout(resolve, 3000));
      }
    }

    function renderTransactions(txs) {
      const container = document.getElementById('tx-history-container');
      if (!txs || !txs.length) {
        container.innerHTML = `<p class="muted">${Hub.esc(Hub.t('wallet.noTransactions'))}</p>`;
        return;
      }

      container.innerHTML = `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>${Hub.esc(Hub.t('wallet.time'))}</th>
                <th>${Hub.esc(Hub.t('wallet.transactionId'))}</th>
                <th>${Hub.esc(Hub.t('wallet.type'))}</th>
                <th>${Hub.esc(Hub.t('wallet.amount'))}</th>
                <th>${Hub.esc(Hub.t('wallet.status'))}</th>
              </tr>
            </thead>
            <tbody>
              ${txs.map(t => {
                let badgeClass = '';
                let typeKey = 'wallet.type.' + t.type;
                if (t.status === 'refunded') { typeKey = 'wallet.type.refund'; badgeClass = ''; }
                else if (t.type === 'deposit') badgeClass = 'warn';
                else if (t.type === 'trip_fee') badgeClass = 'secondary';

                return `
                  <tr>
                    <td>${new Date(t.timestamp).toLocaleString(I18n.lang)}</td>
                    <td><code>${Hub.esc(t.transaction_id)}</code></td>
                    <td><b>${Hub.esc(Hub.t(typeKey))}</b></td>
                    <td style="font-weight:700;">${(t.amount || 0).toLocaleString()} VND</td>
                    <td><span class="badge ${badgeClass}">${Hub.esc(Hub.t('wallet.status.' + t.status))}</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    document.getElementById('btn-submit-topup').onclick = async () => {
      const amt = parseInt(document.getElementById('inp-custom-amount').value) || selectedAmount;
      if (amt < 10000) {
        alert(Hub.t('wallet.minimumAmount'));
        return;
      }

      try {
        const res = await API.post('/api/wallet/topup', { amount: amt, method: selectedMethod });
        if (res.pay_url) {
          window.location.href = res.pay_url;
        }
      } catch (e) {
        alert(e.message);
      }
    };

    document.addEventListener('langchange', () => { renderCheckoutNotice(); renderTransactions(lastTransactions); });
    document.addEventListener('langchange', loadPaymentMethods);
    loadPaymentMethods();
    loadWallet();
    resolvePendingCheckout();
  </script>
  <!-- Bổ sung thư viện Lucide để render icon -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
