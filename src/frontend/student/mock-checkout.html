<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Payment Gateway Checkout (Mock)</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <style>
    .checkout-wrap {
      max-width: 460px;
      margin: 32px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .checkout-banner {
      background: linear-gradient(135deg, #a51263, #d91b7e);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .checkout-body {
      padding: 24px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .qr-payment-box {
      width: 160px;
      height: 160px;
      margin: 20px auto;
      border: 2px dashed #d91b7e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #111;
      font-family: monospace;
      text-align: center;
      padding: 8px;
    }
    .btn-success {
      background: #10b981;
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-failed {
      background: #ef4444;
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body data-role="student">
  <div class="checkout-wrap">
    <div class="checkout-banner">
      <div style="font-size:1.8rem; font-weight:800; letter-spacing:1px;">MoMo / VNPay</div>
      <div style="font-size:0.85rem; opacity:0.9;">Secure Payment Gateway Simulator</div>
    </div>
    <div class="checkout-body">
      <div class="info-row">
        <span class="muted">Merchant:</span>
        <b>Smart E-Mobility Hub</b>
      </div>
      <div class="info-row">
        <span class="muted">Order ID:</span>
        <code id="txt-order-id">ORD-00000000</code>
      </div>
      <div class="info-row">
        <span class="muted">Total Amount:</span>
        <b id="txt-amount" style="font-size:1.25rem; color:#d91b7e;">0 VND</b>
      </div>

      <div class="qr-payment-box">
        <div style="font-size:1.1rem; font-weight:800; color:#a51263;">VIETQR / MOMO</div>
        <div style="font-size:0.75rem; color:#555; margin-top:6px;">Scan with banking app</div>
      </div>

      <p class="muted" style="font-size:0.8rem; text-align:center; margin-bottom:20px;">
        This simulated checkout tests the cryptographic HMAC signature and idempotent webhook callback of Step 3 in the group demo script.
      </p>

      <button type="button" class="btn-success" id="btn-pay-success">
        ✓ Simulate Payment Success
      </button>
      <button type="button" class="btn-failed" id="btn-pay-fail">
        ✕ Simulate Payment Decline / Cancel
      </button>
    </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || '';
    const amount = parseInt(urlParams.get('amount')) || 0;
    const userId = urlParams.get('user_id') || '';
    const signature = urlParams.get('signature') || '';

    document.getElementById('txt-order-id').textContent = orderId;
    document.getElementById('txt-amount').textContent = amount.toLocaleString() + ' VND';

    async function sendCallback(success) {
      try {
        await API.post('/api/payments/callback', {
          order_id: orderId,
          amount: amount,
          user_id: userId,
          signature: signature,
          success: success
        });
        window.location.href = '/app/student/wallet.html?checkout=' + (success ? 'success' : 'failed');
      } catch (err) {
        alert('Callback failed: ' + err.message);
      }
    }

    document.getElementById('btn-pay-success').onclick = () => sendCallback(true);
    document.getElementById('btn-pay-fail').onclick = () => sendCallback(false);
  </script>
</body>
</html>
