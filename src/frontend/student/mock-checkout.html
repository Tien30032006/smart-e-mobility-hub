<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="checkout.title">Payment Gateway Checkout (Mock)</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <style>
    .checkout-wrap {
      max-width: 480px;
      margin: 32px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg, 0 10px 30px rgba(0,0,0,0.1));
    }
    .checkout-banner {
      background: linear-gradient(135deg, #a51263, #d91b7e);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .checkout-body {
      padding: 24px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .qr-payment-box {
      width: 170px;
      height: 170px;
      margin: 20px auto;
      border: 2px dashed #d91b7e;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #111;
      font-family: monospace;
      text-align: center;
      padding: 12px;
    }
    .btn-success {
      background: #10b981;
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s ease;
    }
    .btn-failed {
      background: #ef4444;
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s ease;
    }
    .btn-cancel {
      background: var(--bg);
      color: var(--ink);
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-success:hover, .btn-failed:hover { opacity: 0.9; }
  </style>
</head>
<body data-role="student">
  <nav id="nav"></nav>
  <main>
    <div class="checkout-wrap">
      <div class="checkout-banner">
        <div style="font-size:1.8rem; font-weight:800; letter-spacing:1px;">MoMo / VNPay</div>
        <div style="font-size:0.85rem; opacity:0.9;" data-i18n="checkout.bannerSub">Simulated MoMo / VNPay IPN Checkout</div>
      </div>
      <div class="checkout-body">
        <div class="info-row">
          <span class="muted" data-i18n="checkout.orderId">Order ID:</span>
          <code id="txt-order-id">ORD-00000000</code>
        </div>
        <div class="info-row">
          <span class="muted" data-i18n="checkout.student">Student Account:</span>
          <span id="txt-user-id" style="font-weight:600;"></span>
        </div>
        <div class="info-row">
          <span class="muted" data-i18n="checkout.amount">Amount to Pay:</span>
          <b id="txt-amount" style="font-size:1.3rem; color:#d91b7e;">0 VND</b>
        </div>

        <div class="qr-payment-box">
          <div style="font-size:1.1rem; font-weight:800; color:#a51263;">VIETQR / MOMO</div>
          <div style="font-size:0.75rem; color:#555; margin-top:8px;" data-i18n="checkout.qrNote">MOCK QR CODE</div>
        </div>

        <p class="muted" style="font-size:0.85rem; text-align:center; margin-bottom:20px;" data-i18n="checkout.scanQr">
          Scan QR with MoMo/VNPay app or choose test outcome below:
        </p>

        <button type="button" class="btn-success" id="btn-pay-success">
          ✓ <span data-i18n="checkout.btnSuccess">Simulate Successful Payment</span>
        </button>
        <button type="button" class="btn-failed" id="btn-pay-fail">
          ✕ <span data-i18n="checkout.btnFailed">Simulate Payment Failure</span>
        </button>
        <a href="/app/student/wallet.html" class="btn-cancel" data-i18n="checkout.btnCancel">Cancel and Return to Wallet</a>
      </div>
    </div>
  </main>

  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || '';
    const amount = parseInt(urlParams.get('amount')) || 0;
    const userId = urlParams.get('user_id') || '';
    const signature = urlParams.get('signature') || '';

    function formatAmount() {
      const locale = I18n.lang === 'vi' ? 'vi-VN' : 'en-US';
      document.getElementById('txt-amount').textContent = amount.toLocaleString(locale) + ' VND';
    }

    document.getElementById('txt-order-id').textContent = orderId;
    document.getElementById('txt-user-id').textContent = userId;
    formatAmount();

    async function sendCallback(success) {
      try {
        await API.post('/api/payments/callback', {
          order_id: orderId,
          amount: amount,
          user_id: userId,
          signature: signature,
          success: success
        });
        window.location.href = '/app/student/wallet.html?checkout=' + (success ? 'success' : 'failed');
      } catch (err) {
        alert('Callback failed: ' + err.message);
      }
    }

    document.getElementById('btn-pay-success').onclick = () => sendCallback(true);
    document.getElementById('btn-pay-fail').onclick = () => sendCallback(false);

    document.addEventListener('langchange', () => {
      I18n.apply();
      formatAmount();
    });
  </script>
</body>
</html>
