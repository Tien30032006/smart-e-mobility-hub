<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="page.findHub.title">Find Hub & Vehicle</title>
  <script src="/shared/i18n.js"></script>
  <!-- Leaflet 1.9 CDN & CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Shared Leaflet Wrapper -->
  <script src="/shared/map.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <link rel="stylesheet" href="/app/student/find-hub.css">
</head>
<body data-role="student">
  <!-- OWNER: Member 1   USE CASE: U1  (real Leaflet map + distance from GPS / tapped point to every hub; data from /api/hubs) -->
  <nav id="nav"></nav>
  <main>
    <header class="page-head">
      <h1 id="greet"></h1>
      <p class="muted" data-i18n="page.findHub.sub"></p>
    </header>
    <label class="field-label" for="q" data-i18n="page.findHub.dest"></label>
    <div class="search autocomplete" id="hub-search"><input id="q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="hub-suggestions" data-i18n-attr="placeholder:page.findHub.search"><span id="qi"></span><div id="hub-suggestions" class="autocomplete-list" role="listbox" hidden></div></div>
    <div class="seg full" role="group" id="mode" style="margin-top:16px">
      <button type="button" data-m="shared" aria-pressed="true" data-i18n="page.findHub.shared"></button>
      <button type="button" data-m="personal" aria-pressed="false" data-i18n="page.findHub.personal"></button>
    </div>
    <div id="vehicle-filters" class="geo-tools" style="margin-top:12px">
      <label class="field-label" for="vehicle-type"><span data-i18n="vehicle.filterType"></span>
        <select id="vehicle-type"><option value="" data-i18n="vehicle.typeAll"></option><option value="e-bike" data-i18n="vehicle.type.bike"></option><option value="e-motorcycle" data-i18n="vehicle.type.motorcycle"></option><option value="e-scooter" data-i18n="vehicle.type.scooter"></option></select>
      </label>
      <label class="field-label" for="min-battery"><span data-i18n="vehicle.minBattery"></span> <select id="min-battery"><option value="0" data-i18n="vehicle.minBattery.any"></option><option value="30">30%</option><option value="50">50%</option><option value="70">70%</option></select></label>
    </div>

    <div class="geo-bar">
      <div class="origin-search autocomplete" id="origin-search">
        <label class="field-label" for="origin-q" data-i18n="student.geo.addressLabel"></label>
        <input id="origin-q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="origin-suggestions" data-i18n-attr="placeholder:student.geo.addressPlaceholder">
        <div id="origin-suggestions" class="autocomplete-list" role="listbox" aria-live="polite" hidden></div>
        <small class="geocoder-credit"><span data-i18n="student.geo.addressCredit"></span> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://github.com/komoot/photon" target="_blank" rel="noopener">Photon</a></small>
      </div>
      <button type="button" id="gps"><span id="gps-i"></span> <span id="gps-t" data-i18n="student.geo.useGps"></span></button>
    </div>
    <div class="geo-from" id="from" aria-live="polite"></div>
    <div class="geo-notice" id="geo-notice" role="status" hidden></div>
    <div class="map-wrap">
      <div id="leaflet-map" role="application" aria-label="Map"></div>
      <span class="map-hint" data-i18n="student.geo.tapMap"></span>
    </div>
    <div class="route-info" id="route-info" aria-live="polite"></div>
    <div class="legend" id="legend"></div>

    <div class="geo-tools">
      <div class="seg" role="group" id="kinds"></div>
      <div class="seg" role="group" id="sort">
        <button type="button" data-s="dist" aria-pressed="true" data-i18n="student.geo.sortDist"></button>
        <button type="button" data-s="stock" aria-pressed="false" data-i18n="student.geo.sortStock"></button>
      </div>
    </div>
    <div class="geo-pick"><label class="field-label" for="hub-pick" data-i18n="student.geo.pickHub"></label><select id="hub-pick"></select></div>

    <div id="app" style="margin-top:8px"></div>
  </main>

  <script src="/shared/api-client.js"></script>
  <script src="/shared/stream.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    const s = Hub.init();
    const DEFAULT_ID = 'HUB-METRO';                // fallback origin when GPS is denied (flow ngoai le 1)
    const KINDS = ['all', 'metro', 'dorm', 'library', 'campus'];
    let mode = 'shared', query = '', kind = 'all', sortBy = 'dist', vehicleType = '', minBattery = 0, showAllHubs = false;
    let hubs = [], inventory = {}, selected = null, origin = null, source = 'default';   // origin = {lat,lng}
    let map = null, layer = null, picker = null, mapOk = false, routeSeq = 0;
    let hubMatches = [], hubActive = -1, hubSuggestionsOpen = false, originActive = -1, originSuggestionsOpen = false, originRequest = 0, originTimer = null, originAddressLabel = '';
    const walkReal = {};                           // hub_id -> {distance, minutes} from the routing service
    const first = s ? s.full_name.trim().split(/\s+/).pop() : '';
    const $ = id => document.getElementById(id);
    const T = (k, v) => Hub.t(k, v);
    const stat = h => mode === 'shared' ? T('hub.vehShort', { n: inventory[h.hub_id] || 0 }) + ' · ' + T('hub.spacesShort', { n: h.free_spaces })
                                         : T('hub.spacesShort', { n: h.free_spaces }) + ' · ' + T('hub.freePorts', { n: h.charging_points_free });

    /* ---------- distance model ---------- */
    function ranked() {
      if (!origin) return hubs.map(h => ({ hub: h }));
      return HubMap.rankHubs(hubs, origin).map(r => {
        const real = walkReal[r.hub.hub_id];
        return real && real.from === origin.lat + ',' + origin.lng ? { ...r, distance_m: real.distance, walk_min: real.minutes, real: true } : r;
      });
    }
    function distLabel(r) { return r.distance_m == null ? '' : HubMap.formatDistance(r.distance_m, I18n.lang); }
    // Approximate an electric bicycle trip at 15 km/h using the street-distance estimate.
    function electricMinutes(m) { return Math.max(1, Math.round((m || 0) * 1.25 / 250)); }

    /* ---------- notices ---------- */
    function notice(key) { const n = $('geo-notice'); n.hidden = !key; n.textContent = key ? T(key) : ''; }
    function normalizeSearch(text) { return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().trim(); }
    function fromLabel() {
      const k = { gps: 'student.geo.fromGps', map: 'student.geo.fromMap', hub: 'student.geo.fromHub', default: 'student.geo.fromDefault' }[source];
      const value = source === 'address' ? originAddressLabel : T(k);
      $('from').innerHTML = Hub.esc(T('student.geo.from')) + ': <b>' + Hub.esc(value) + '</b>';
    }
    function closeHubSuggestions() { hubSuggestionsOpen = false; hubActive = -1; $('q').setAttribute('aria-expanded', 'false'); $('hub-suggestions').hidden = true; }
    function renderHubSuggestions() {
      const box = $('hub-suggestions'), input = $('q'), needle = normalizeSearch(query);
      hubMatches = needle ? hubs.filter(h => normalizeSearch(I18n.hubName(h)).includes(needle)).slice(0, 6)
                          : (hubSuggestionsOpen ? ranked().slice(0, 6).map(r => r.hub) : []);
      box.innerHTML = hubMatches.map((h, i) => `<button type="button" role="option" aria-selected="${i === hubActive}" id="hub-option-${i}" data-index="${i}"><b>${Hub.esc(I18n.hubName(h))}</b><small>${Hub.esc(T('student.geo.kind.' + HubMap.hubKind(h)))} · ${Hub.esc(T('hub.vehShort', { n: inventory[h.hub_id] || 0 }))}</small></button>`).join('');
      box.hidden = !hubSuggestionsOpen || !hubMatches.length;
      input.setAttribute('aria-expanded', String(!box.hidden));
      if (hubMatches.length && hubSuggestionsOpen) {
        box.querySelectorAll('[role="option"]').forEach(option => option.onpointerdown = e => { e.preventDefault(); chooseHubSuggestion(Number(option.dataset.index)); });
      }
    }
    function chooseHubSuggestion(index) {
      const h = hubMatches[index]; if (!h) return;
      query = I18n.hubName(h); $('q').value = query; closeHubSuggestions(); selectHub(h.hub_id, true);
    }
    function formatAddress(p) {
      const street = [p.housenumber, p.street].filter(Boolean).join(' ');
      return [...new Set([p.name, street, p.locality, p.district, p.city, p.state, p.country].filter(Boolean))].join(', ');
    }
    function closeOriginSuggestions() { originSuggestionsOpen = false; originActive = -1; $('origin-q').setAttribute('aria-expanded', 'false'); $('origin-suggestions').hidden = true; }
    function renderOriginSuggestions(items, message) {
      const box = $('origin-suggestions');
      box.innerHTML = items.length ? items.map((item, i) => `<button type="button" role="option" aria-selected="${i === originActive}" id="origin-option-${i}" data-index="${i}"><b>${Hub.esc(item.label)}</b><small>${Hub.esc([item.feature.properties.city, item.feature.properties.state, item.feature.properties.country].filter(Boolean).join(' · '))}</small></button>`).join('') : (message ? `<div class="autocomplete-message">${Hub.esc(T(message))}</div>` : '');
      box.hidden = !originSuggestionsOpen || (!items.length && !message);
      $('origin-q').setAttribute('aria-expanded', String(!box.hidden));
      if (items.length && originSuggestionsOpen) box.querySelectorAll('[role="option"]').forEach(option => option.onpointerdown = e => { e.preventDefault(); chooseAddress(items[Number(option.dataset.index)]); });
    }
    function chooseAddress(item) {
      if (!item) return;
      const [lng, lat] = item.feature.geometry.coordinates;
      originAddressLabel = item.label; $('origin-q').value = item.label; closeOriginSuggestions(); notice(null);
      setOrigin({ lat, lng }, 'address', true, item.label);
      if (mapOk) { HubMap.flyTo(map, lat, lng, 15); layer.fit([{ lat, lng }]); }
    }
    async function searchAddress(text) {
      const seq = ++originRequest, q = text.trim();
      if (q.length < 3) { renderOriginSuggestions([], 'student.geo.addressTypeMore'); return; }
      renderOriginSuggestions([], 'student.geo.addressSearching');
      try {
        const params = new URLSearchParams({ q, limit: '5' });
        if (I18n.lang !== 'vi') params.set('lang', 'en');
        if (origin) { params.set('lat', String(origin.lat)); params.set('lon', String(origin.lng)); }
        const response = await fetch('https://photon.komoot.io/api/?' + params.toString(), { signal: AbortSignal.timeout(8000) });
        if (!response.ok) throw new Error('geocoder');
        const data = await response.json(); if (seq !== originRequest) return;
        const seen = new Set();
        const items = (data.features || []).map(feature => ({ feature, label: formatAddress(feature.properties || {}) })).filter(item => {
          if (!item.label || seen.has(item.label)) return false;
          seen.add(item.label); return true;
        });
        renderOriginSuggestions(items, items.length ? '' : 'student.geo.addressNoResults');
      } catch (error) {
        if (seq !== originRequest) return;
        renderOriginSuggestions([], 'student.geo.addressError');
      }
    }

    /* ---------- list ---------- */
    function draw() {
      $('vehicle-filters').hidden = mode !== 'shared';
      $('greet').textContent = T('page.findHub.greet', { name: first });
      $('qi').innerHTML = Hub.icon('search');
      $('gps-i').innerHTML = Hub.icon('locate');
      $('legend').innerHTML = `<span class="badge">${Hub.esc(T('hub.stockHigh'))}</span><span class="badge warn">${Hub.esc(T('hub.stockLow'))}</span><span class="badge bad">${Hub.esc(T('hub.stockFull'))}</span>`;
      $('kinds').innerHTML = KINDS.map(k => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${Hub.esc(T(k === 'all' ? 'student.geo.all' : 'student.geo.kind.' + k))}</button>`).join('');
      $('kinds').querySelectorAll('button').forEach(b => b.onclick = () => { kind = b.dataset.k; draw(); syncMap(); });
      $('sort').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === sortBy));
      $('hub-pick').innerHTML = hubs.map(h => `<option value="${Hub.esc(h.hub_id)}" ${source === 'hub' && selected === h.hub_id ? 'selected' : ''}>${Hub.esc(I18n.hubName(h))}</option>`).join('');
      renderHubSuggestions();
      fromLabel();

      let rows = ranked().filter(r => (kind === 'all' || HubMap.hubKind(r.hub) === kind) &&
                                      normalizeSearch(I18n.hubName(r.hub)).includes(normalizeSearch(query)));
      rows.sort(sortBy === 'dist' && origin ? (a, b) => a.distance_m - b.distance_m : (a, b) => (inventory[b.hub.hub_id] || 0) - (inventory[a.hub.hub_id] || 0));
      const visibleRows = showAllHubs ? rows.slice() : rows.slice(0, 3);
      if (!showAllHubs && selected && !visibleRows.some(r => r.hub.hub_id === selected)) {
        const selectedRow = rows.find(r => r.hub.hub_id === selected);
        if (selectedRow) visibleRows.push(selectedRow);
      }
      const el = $('app');
      el.innerHTML = `<div class="section-title"><h2>${Hub.esc(T('page.findHub.near'))}</h2></div>` +
        (rows.length ? visibleRows.map(r => { const h = r.hub, tn = Hub.tone(h), available = inventory[h.hub_id] || 0;
          return `<div class="card hubrow ${tn}" data-hub="${Hub.esc(h.hub_id)}" tabindex="0" role="button" ${selected === h.hub_id ? 'aria-current="true"' : ''}>
            <span class="pinico">${Hub.icon('pin')}</span>
            <span class="grow"><span class="kind">${Hub.esc(T('student.geo.kind.' + HubMap.hubKind(h)))}</span><b>${Hub.esc(I18n.hubName(h))}</b>
              <span class="meta">${Hub.esc(stat(h))} · ${Math.round(h.utilization * 100)}${Hub.esc(T('hub.full'))}</span><br>
              <span class="${mode === 'shared' ? (available === 0 ? 'muted' : 'ok') : (h.free_spaces === 0 ? 'muted' : 'ok')}">${Hub.esc(mode === 'shared' ? (available ? T('hub.ready', { n: available }) : T('hub.noVehiclesMatch')) : T('hub.freeSpaces', { n: h.free_spaces }))}</span><br>
              ${(mode === 'shared' ? available > 0 : h.free_spaces > 0) ? `<a class="go" href="/app/student/reserve-vehicle.html?hub=${encodeURIComponent(h.hub_id)}${mode === 'personal' ? '&mode=private' : ''}">${Hub.esc(mode === 'personal' ? T('reserve.modePrivate') : T('menu.reserve'))} →</a>` : ''}</span>
            ${r.distance_m != null ? `<span class="dist">${Hub.esc(distLabel(r))}<small class="route-times" aria-label="${Hub.esc(T('student.geo.routeTimes', { walk: r.walk_min, electric: electricMinutes(r.distance_m) }))}"><span>${Hub.esc(T(r.real ? 'student.geo.walk' : 'student.geo.walkApprox', { n: r.walk_min }))}</span><span class="route-electric">${Hub.icon('zap')}${Hub.esc(T('student.geo.electric', { n: electricMinutes(r.distance_m) }))}</span></small></span>` : ''}
          </div>`; }).join('') + (rows.length > visibleRows.length ? `<button type="button" class="secondary hub-list-toggle" data-show-all-hubs aria-expanded="false">${Hub.esc(T('student.geo.showAllHubs', { n: rows.length }))}</button>` : showAllHubs && rows.length > 3 ? `<button type="button" class="secondary hub-list-toggle" data-show-all-hubs aria-expanded="true">${Hub.esc(T('student.geo.showFewerHubs'))}</button>` : '') : `<p class="muted">${Hub.esc(T('page.findHub.empty'))}</p>`);
      el.querySelector('[data-show-all-hubs]')?.addEventListener('click', () => { showAllHubs = !showAllHubs; draw(); });
      el.querySelectorAll('.hubrow').forEach(row => {
        const pick = e => { if (e.target.closest('a.go')) return; selectHub(row.dataset.hub, true); };
        row.onclick = pick; row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } };
      });
    }

    /* ---------- map ---------- */
    function syncMap() {
      if (!mapOk) return;
      const dist = {}; ranked().forEach(r => { if (r.distance_m != null) dist[r.hub.hub_id] = r; });
      layer.update(hubs, dist);
      layer.visible(new Set(hubs.filter(h => kind === 'all' || HubMap.hubKind(h) === kind).map(h => h.hub_id)));
      layer.select(selected);
    }
    async function drawRoute() {
      if (!mapOk) return;
      const seq = ++routeSeq, h = hubs.find(x => x.hub_id === selected), info = $('route-info');
      if (!h || !origin) { if (map._currentRouteLayer) { map.removeLayer(map._currentRouteLayer); map._currentRouteLayer = null; } info.textContent = ''; return; }
      const from = { ...origin };
      const l = await HubMap.routeTo(map, from, h.location);
      if (seq !== routeSeq || !l || !l.routeInfo) return;           // a newer click superseded this one
      const ri = l.routeInfo, mins = Math.max(1, Math.round(ri.duration / 60));
      if (!ri.straight) { walkReal[h.hub_id] = { distance: ri.distance, minutes: mins, from: from.lat + ',' + from.lng }; draw(); syncMap(); }
      info.textContent = T('student.geo.routeSummary', { name: I18n.hubName(h), dist: HubMap.formatDistance(ri.distance, I18n.lang), walk: mins, electric: electricMinutes(ri.distance) }) +
                         (ri.straight ? ' (' + T('student.geo.straight') + ')' : '');
    }
    function selectHub(id, fly) {
      selected = selected === id && !fly ? null : id;
      const h = hubs.find(x => x.hub_id === id);
      if (mapOk && layer) { layer.select(selected, true); if (fly && h) HubMap.flyTo(map, h.location.lat, h.location.lng, 16); }
      draw(); drawRoute();
    }
    function setOrigin(pt, src, move, label) {
      origin = { lat: pt.lat, lng: pt.lng }; source = src;
      originAddressLabel = src === 'address' ? (label || originAddressLabel) : '';
      if (src !== 'address' && $('origin-q')) $('origin-q').value = '';
      if (mapOk && move) picker.set(pt.lat, pt.lng, 'api');
      fromLabel(); draw(); syncMap(); drawRoute();
    }

    function initMap() {
      if (typeof L === 'undefined') { notice('student.geo.noLeaflet'); $('leaflet-map').parentElement.hidden = true; return; }
      let tileErrs = 0;
      map = HubMap.initMap('leaflet-map', { onTileError: () => { if (++tileErrs === 6) { notice('student.geo.tileFail'); } } });
      if (!map) return;
      mapOk = true;
      layer = HubMap.hubLayer(map, h => selectHub(h.hub_id, false));
      picker = HubMap.originPicker(map, (pt, how) => { if (how === 'map' || how === 'drag') { notice(null); setOrigin(pt, 'map', false); } });
      setTimeout(() => map.invalidateSize(), 200);
    }

    /* ---------- GPS ---------- */
    async function useGps() {
      const t = $('gps-t'); $('gps').disabled = true; t.textContent = T('student.geo.locating');
      try {
        const p = await HubMap.locate();
        notice(null); setOrigin(p, 'gps', true);
        if (mapOk) layer.fit([p]);
      } catch (e) {
        notice(e && e.code === 1 ? 'student.geo.denied' : 'student.geo.unavailable');
      } finally { $('gps').disabled = false; t.textContent = T('student.geo.useGps'); }
    }

    /* ---------- events ---------- */
    $('q').oninput = e => { query = e.target.value; hubSuggestionsOpen = true; hubActive = -1; draw(); };
    $('q').onfocus = () => { hubSuggestionsOpen = true; renderHubSuggestions(); };
    $('q').onkeydown = e => {
      if (e.key === 'Escape') { closeHubSuggestions(); return; }
      if (!hubMatches.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hubSuggestionsOpen = true; hubActive = (hubActive + (e.key === 'ArrowDown' ? 1 : hubMatches.length - 1)) % hubMatches.length; renderHubSuggestions(); $('hub-option-' + hubActive)?.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter' && hubSuggestionsOpen && hubActive >= 0) { e.preventDefault(); chooseHubSuggestion(hubActive); }
    };
    $('origin-q').oninput = e => { const q = e.target.value; originSuggestionsOpen = true; originActive = -1; clearTimeout(originTimer); originTimer = setTimeout(() => searchAddress(q), 350); };
    $('origin-q').onfocus = () => { if ($('origin-q').value.trim().length >= 3) { originSuggestionsOpen = true; searchAddress($('origin-q').value); } };
    $('origin-q').onkeydown = e => {
      const options = $('origin-suggestions').querySelectorAll('[role="option"]');
      if (e.key === 'Escape') { ++originRequest; closeOriginSuggestions(); return; }
      if (!options.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); originActive = (originActive + (e.key === 'ArrowDown' ? 1 : options.length - 1)) % options.length; options.forEach((option, i) => option.setAttribute('aria-selected', String(i === originActive))); $('origin-option-' + originActive)?.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter' && originActive >= 0) { e.preventDefault(); $('origin-option-' + originActive)?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); }
    };
    document.addEventListener('click', e => { if (!e.target.closest('#hub-search')) closeHubSuggestions(); if (!e.target.closest('#origin-search')) { ++originRequest; closeOriginSuggestions(); } });
    $('gps').onclick = useGps;
    $('sort').querySelectorAll('button').forEach(b => b.onclick = () => { sortBy = b.dataset.s; draw(); });
    $('hub-pick').onchange = e => { const h = hubs.find(x => x.hub_id === e.target.value); if (h) { selected = null; setOrigin(h.location, 'hub', true); if (mapOk) HubMap.flyTo(map, h.location.lat, h.location.lng, 15); } };
    document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
      mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    document.addEventListener('langchange', () => { if (hubs.length) { draw(); syncMap(); drawRoute(); } });
    async function refresh() { try { hubs = await API.get('/api/hubs'); await loadInventory(); draw(); syncMap(); } catch (e) { /* keep last data */ } }
    async function loadInventory() {
      const qs = new URLSearchParams({ min_battery: String(minBattery) });
      if (vehicleType) qs.set('vehicle_type', vehicleType);
      const rows = await API.get('/api/reservation/search?' + qs.toString());
      inventory = Object.fromEntries(rows.map(h => [h.hub_id, h.vehicles_available]));
    }
    $('vehicle-type').onchange = e => { vehicleType = e.target.value; loadInventory().then(draw).catch(() => {}); };
    $('min-battery').onchange = e => { minBattery = Number(e.target.value); loadInventory().then(draw).catch(() => {}); };
    if (window.Stream) Stream.on('hub_updated', refresh);

    initMap();
    Hub.render($('app'), API.get('/api/hubs'), async data => {
      const firstLoad = !hubs.length;
      hubs = data;
      if (firstLoad) {
        const d = hubs.find(h => h.hub_id === DEFAULT_ID) || hubs[0];
        if (d) { origin = { lat: d.location.lat, lng: d.location.lng }; }
        syncMap(); if (mapOk) { layer.fit(); }
        useGps();                                   // ask for the real position; keep default if refused
      }
      await loadInventory().catch(() => {}); draw(); syncMap();
    });
  </script>
  <style>#vehicle-filters[hidden]{display:none}</style>
</body>
</html>
