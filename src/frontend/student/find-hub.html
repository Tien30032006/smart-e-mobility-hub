<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="page.findHub.title">Find Hub & Vehicle</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <style>
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 24px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
      flex: 1;
    }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filter-group select, .filter-group input {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.9rem;
    }
    .campus-map-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .map-legend {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: #10b981; }
    .dot.yellow { background: #f59e0b; }
    .dot.red { background: #ef4444; }
    .svg-map-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      background: var(--bg);
      border: 1px dashed var(--line);
      overflow: hidden;
    }
    .svg-map {
      width: 100%;
      height: 260px;
      display: block;
    }
    .hub-pin {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .hub-pin:hover {
      transform: scale(1.05);
    }
    .hub-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .hub-detail-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .hub-detail-card.highlighted {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px var(--brand);
    }
    .hub-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .hub-title-group h2 {
      margin: 0 0 4px 0;
      font-size: 1.25rem;
    }
    .sub-section-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 16px 0 12px 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .vehicle-item {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .v-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .v-title {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .battery-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .battery-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .infra-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      align-items: center;
    }
    .infra-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .infra-stat .val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand);
    }
    .infra-stat .desc {
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body data-role="student">
  <nav id="nav"></nav>
  <main>
    <header class="page-head">
      <h1 data-i18n="page.findHub.title">Find Hub & Vehicle</h1>
      <p class="muted" data-i18n="page.findHub.desc"></p>
      <div class="chips">
        <span class="chip"><span><span data-i18n="common.owner"></span>: Member 1</span></span>
        <span class="chip"><span><span data-i18n="common.useCase"></span>: U1</span></span>
      </div>
    </header>

    <!-- Filters Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label data-i18n="filter.fromHub">Origin Hub</label>
        <select id="sel-from-hub">
          <option value="" data-i18n="filter.allHubs">All Hubs</option>
          <option value="HUB-METRO">VNU Metro Station</option>
          <option value="HUB-KTX">Dormitory Zone A</option>
          <option value="HUB-CAMPUS">University Campus</option>
          <option value="HUB-LIB">Central Library</option>
        </select>
      </div>
      <div class="filter-group">
        <label data-i18n="filter.allTypes">Vehicle Type</label>
        <select id="sel-vtype">
          <option value="" data-i18n="filter.allTypes">All vehicle types</option>
          <option value="e-bike" data-i18n="filter.bike">E-Bike</option>
          <option value="e-scooter" data-i18n="filter.scooter">E-Scooter</option>
          <option value="e-motorcycle" data-i18n="filter.motorcycle">E-Motorcycle</option>
        </select>
      </div>
      <div class="filter-group">
        <label data-i18n="filter.minBattery">Min Battery (%)</label>
        <select id="sel-battery">
          <option value="0">Any (>= 0%)</option>
          <option value="30">>= 30%</option>
          <option value="50">>= 50%</option>
          <option value="80">>= 80%</option>
        </select>
      </div>
      <div style="display:flex; gap:8px; align-self: flex-end;">
        <button id="btn-filter" class="button" data-i18n="filter.apply">Filter</button>
        <button id="btn-reset" class="button secondary" data-i18n="filter.reset">Reset</button>
      </div>
    </div>

    <!-- Interactive Campus Map Section -->
    <div class="campus-map-card">
      <div class="map-header">
        <h2 style="font-size:1.1rem; margin:0;" data-i18n="map.title">Interactive Campus Hub Map</h2>
        <div class="map-legend">
          <span class="legend-item"><span class="dot green"></span><span data-i18n="map.highAvail">Available (>30%)</span></span>
          <span class="legend-item"><span class="dot yellow"></span><span data-i18n="map.lowAvail">Limited (<30%)</span></span>
          <span class="legend-item"><span class="dot red"></span><span data-i18n="map.full">Full (0 free)</span></span>
        </div>
      </div>
      <div class="svg-map-wrapper">
        <svg class="svg-map" viewBox="0 0 800 260" id="campus-svg-map">
          <!-- Campus Paths -->
          <line x1="160" y1="70" x2="640" y2="70" stroke="var(--line)" stroke-dasharray="6,6" stroke-width="2"/>
          <line x1="160" y1="70" x2="220" y2="190" stroke="var(--line)" stroke-dasharray="6,6" stroke-width="2"/>
          <line x1="640" y1="70" x2="580" y2="190" stroke="var(--line)" stroke-dasharray="6,6" stroke-width="2"/>
          <line x1="220" y1="190" x2="580" y2="190" stroke="var(--line)" stroke-dasharray="6,6" stroke-width="2"/>

          <!-- Dynamic Pins will be rendered here -->
          <g id="map-pins-layer"></g>
        </svg>
      </div>
    </div>

    <!-- Main Content Container for Hubs -->
    <div id="app"></div>
  </main>

  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();

    const HUB_COORDS = {
      'HUB-KTX': { x: 160, y: 70 },
      'HUB-METRO': { x: 640, y: 70 },
      'HUB-CAMPUS': { x: 220, y: 190 },
      'HUB-LIB': { x: 580, y: 190 }
    };

    let currentFilters = { from_hub: '', vehicle_type: '', min_battery: 0 };

    function fetchHubs() {
      let query = [];
      if (currentFilters.from_hub) query.push('from_hub=' + encodeURIComponent(currentFilters.from_hub));
      if (currentFilters.vehicle_type) query.push('vehicle_type=' + encodeURIComponent(currentFilters.vehicle_type));
      if (currentFilters.min_battery > 0) query.push('min_battery=' + encodeURIComponent(currentFilters.min_battery));
      const url = '/api/reservation/search' + (query.length ? '?' + query.join('&') : '');

      Hub.render(document.getElementById('app'), API.get(url), hubs => {
        renderMapPins(hubs);
        renderHubList(hubs);
      });
    }

    function renderMapPins(hubs) {
      const pinsLayer = document.getElementById('map-pins-layer');
      if (!pinsLayer) return;
      pinsLayer.innerHTML = '';

      hubs.forEach(h => {
        const coord = HUB_COORDS[h.hub_id] || { x: 400, y: 130 };
        const color = h.free_spaces === 0 ? '#ef4444' : (h.vehicles_available > 0 ? '#10b981' : '#f59e0b');
        const name = I18n.hubName(h);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'hub-pin');
        g.setAttribute('transform', `translate(${coord.x}, ${coord.y})`);
        g.onclick = () => {
          const el = document.getElementById('card-' + h.hub_id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('highlighted');
            setTimeout(() => el.classList.remove('highlighted'), 2000);
          }
        };

        g.innerHTML = `
          <circle r="22" fill="${color}" fill-opacity="0.2"/>
          <circle r="12" fill="${color}" stroke="white" stroke-width="2"/>
          <text y="30" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="600">${Hub.esc(name)}</text>
          <text y="44" text-anchor="middle" fill="var(--muted)" font-size="10">${h.vehicles_available} 🚲 | ${h.free_spaces} 🅿️</text>
        `;
        pinsLayer.appendChild(g);
      });
    }

    function renderHubList(hubs) {
      const container = document.getElementById('app');
      if (!hubs || hubs.length === 0) {
        container.innerHTML = `<div class="card"><p class="muted">${Hub.esc(Hub.t('vehicle.noVehicles'))}</p></div>`;
        return;
      }

      container.className = 'hub-list';
      container.innerHTML = hubs.map(h => {
        const hubName = I18n.hubName(h);
        const utilPct = Math.round(h.utilization * 100);
        const nearFull = h.near_capacity;

        let vehiclesHtml = '';
        if (h.vehicles && h.vehicles.length > 0) {
          vehiclesHtml = `<div class="vehicle-grid">` +
            h.vehicles.map(v => {
              const batteryColor = v.battery_level >= 50 ? '#10b981' : (v.battery_level >= 30 ? '#f59e0b' : '#ef4444');
              return `
                <div class="vehicle-item">
                  <div>
                    <div class="v-header">
                      <span class="v-title">${Hub.esc(v.model)} (${Hub.esc(v.type)})</span>
                      <span class="badge ${v.battery_level < 30 ? 'warn' : ''}">${v.vehicle_id}</span>
                    </div>
                    <div class="battery-bar-wrap" style="margin-top: 10px;">
                      <div class="battery-label-row">
                        <span>${Hub.esc(Hub.t('vehicle.battery'))}</span>
                        <span style="font-weight:700; color:${batteryColor};">${v.battery_level}%</span>
                      </div>
                      <div class="bar"><div style="width: ${v.battery_level}%; background: ${batteryColor};"></div></div>
                      <div style="font-size:0.75rem; color:var(--muted); margin-top:2px;">
                        ${Hub.esc(Hub.t('vehicle.range'))}: ~${v.estimated_range_km} km
                      </div>
                    </div>
                  </div>
                  <a href="/app/student/reserve-vehicle.html?hub_id=${encodeURIComponent(h.hub_id)}&vehicle_id=${encodeURIComponent(v.vehicle_id)}"
                     class="button" style="text-align:center; text-decoration:none;">
                     ${Hub.icon('zap')} ${Hub.esc(Hub.t('vehicle.reserveBtn'))}
                  </a>
                </div>
              `;
            }).join('') +
          `</div>`;
        } else {
          vehiclesHtml = `<p class="muted" style="margin-bottom: 20px;">${Hub.esc(Hub.t('vehicle.noVehicles'))}</p>`;
        }

        return `
          <div class="hub-detail-card" id="card-${Hub.esc(h.hub_id)}">
            <div class="hub-card-header">
              <div class="hub-title-group">
                <h2>${Hub.esc(hubName)}</h2>
                <div class="chips">
                  <span class="chip"><span>${h.capacity} spaces</span></span>
                  <span class="chip ${nearFull ? 'warn' : ''}"><span>${utilPct}% ${Hub.esc(Hub.t('hub.utilization'))}</span></span>
                </div>
              </div>
              <div style="display:flex; gap:8px;">
                <a href="/app/student/reserve-vehicle.html?tab=parking&hub_id=${encodeURIComponent(h.hub_id)}"
                   class="button secondary" style="text-decoration:none;">
                   ${Hub.icon('parking')} ${Hub.esc(Hub.t('vehicle.parkBtn'))}
                </a>
              </div>
            </div>

            <!-- Shared Vehicles Section -->
            <div class="sub-section-title">
              ${Hub.icon('bike')} ${Hub.esc(Hub.t('hub.sharedFleetSection'))} (${h.vehicles_available})
            </div>
            ${vehiclesHtml}

            <!-- Private EV Section -->
            <div class="sub-section-title">
              ${Hub.icon('plug')} ${Hub.esc(Hub.t('hub.privateEvSection'))}
            </div>
            <div class="infra-grid">
              <div class="infra-stat">
                <span class="val">${h.free_spaces}</span>
                <span class="desc">${Hub.esc(Hub.t('hub.freeDocks'))}</span>
              </div>
              <div class="infra-stat">
                <span class="val">${h.charging_points_free}</span>
                <span class="desc">${Hub.esc(Hub.t('hub.chargers'))}</span>
              </div>
              <div style="text-align:right;">
                <a href="/app/student/reserve-vehicle.html?tab=parking&hub_id=${encodeURIComponent(h.hub_id)}&mode=private"
                   class="button secondary" style="text-decoration:none; font-size:0.85rem;">
                   ${Hub.esc(Hub.t('vehicle.parkBtn'))}
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('btn-filter').onclick = () => {
      currentFilters.from_hub = document.getElementById('sel-from-hub').value;
      currentFilters.vehicle_type = document.getElementById('sel-vtype').value;
      currentFilters.min_battery = parseInt(document.getElementById('sel-battery').value) || 0;
      fetchHubs();
    };

    document.getElementById('btn-reset').onclick = () => {
      document.getElementById('sel-from-hub').value = '';
      document.getElementById('sel-vtype').value = '';
      document.getElementById('sel-battery').value = '0';
      currentFilters = { from_hub: '', vehicle_type: '', min_battery: 0 };
      fetchHubs();
    };

    // Initial load
    fetchHubs();
  </script>
</body>
</html>
