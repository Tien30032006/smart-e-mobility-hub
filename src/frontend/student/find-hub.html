<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="page.findHub.title">Find Hub & Vehicle</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
</head>
<body data-role="student">
  <!-- OWNER: Member 1   USE CASE: U1  (UI v2: mobile-first discover screen; data from /api/hubs.
       TODO(Member 1): add vehicle-type / min-battery filters and link rows to reserve-vehicle.html?hub=<id>.) -->
  <nav id="nav"></nav>
  <main>
    <header class="page-head">
      <h1 id="greet"></h1>
      <p class="muted" data-i18n="page.findHub.sub"></p>
    </header>
    <label class="field-label" for="q" data-i18n="page.findHub.dest"></label>
    <div class="search"><input id="q" type="search" autocomplete="off" data-i18n-attr="placeholder:page.findHub.search"><span id="qi"></span></div>
    <div class="seg full" role="group" id="mode" style="margin-top:16px">
      <button type="button" data-m="shared" aria-pressed="true" data-i18n="page.findHub.shared"></button>
      <button type="button" data-m="personal" aria-pressed="false" data-i18n="page.findHub.personal"></button>
    </div>
    <div id="app" style="margin-top:16px"></div>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    const s = Hub.init();
    let mode = 'shared', query = '', hubs = [], selected = null;
    const first = s ? s.full_name.trim().split(/\s+/).pop() : '';
    const T = (k, n) => Hub.esc(Hub.t(k, { n }));
    const stat = h => mode === 'shared' ? Hub.t('hub.vehShort', { n: h.vehicles_available }) + ' · ' + Hub.t('hub.spacesShort', { n: h.free_spaces })
                                         : Hub.t('hub.spacesShort', { n: h.free_spaces }) + ' · ' + Hub.t('hub.freePorts', { n: h.charging_points_free });

    function draw() {
      document.getElementById('greet').textContent = Hub.t('page.findHub.greet', { name: first });
      document.getElementById('qi').innerHTML = Hub.icon('search');
      const list = hubs.filter(h => I18n.hubName(h).toLowerCase().includes(query.toLowerCase()))
                       .sort((a, b) => b.vehicles_available - a.vehicles_available);
      const el = document.getElementById('app');
      el.innerHTML = Hub.mapHtml(hubs, h => Hub.esc(stat(h)), selected) +
        `<div class="legend"><span class="badge">${T('hub.stockHigh')}</span><span class="badge warn">${T('hub.stockLow')}</span><span class="badge bad">${T('hub.stockFull')}</span></div>` +
        `<div class="section-title"><h2>${T('page.findHub.near')}</h2></div>` +
        (list.length ? list.map(h => { const tn = Hub.tone(h);
          return `<a class="card hubrow ${tn}" href="/app/student/reserve-vehicle.html?hub=${encodeURIComponent(h.hub_id)}" ${selected === h.hub_id ? 'aria-current="true"' : ''}>
            <span class="pinico">${Hub.icon('pin')}</span>
            <span class="grow"><b>${Hub.esc(I18n.hubName(h))}</b>
              <span class="meta">${Hub.esc(Hub.t('hub.freeSpaces', { n: h.free_spaces }))} · ${Math.round(h.utilization * 100)}${Hub.esc(Hub.t('hub.full'))}</span><br>
              <span class="ok">${Hub.esc(mode === 'shared' ? Hub.t('hub.ready', { n: h.vehicles_available }) : Hub.t('hub.freePorts', { n: h.charging_points_free }))}</span></span>
            <span class="chev">${Hub.icon('chevron')}</span></a>`; }).join('')
          : `<p class="muted">${T('page.findHub.empty')}</p>`);
      el.querySelectorAll('.pin').forEach(p => p.onclick = () => { selected = selected === p.dataset.hub ? null : p.dataset.hub; draw(); });
    }
    document.getElementById('q').oninput = e => { query = e.target.value; draw(); document.getElementById('q').focus(); };
    document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
      mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    document.addEventListener('langchange', () => hubs.length && draw());
    Hub.render(document.getElementById('app'), API.get('/api/hubs'), data => { hubs = data; draw(); });
  </script>
</body>
</html>
