<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="auth.onboardTitle">Welcome</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
</head>
<body data-role="student">
  <!-- Shown once after the first Google sign-in: student code, phone, optional private EV (TV2's page). -->
  <nav id="nav"></nav>
  <main>
    <section class="card auth-card">
      <ol class="steps" aria-hidden="true"><li class="done"></li><li id="step2"></li></ol>
      <h1 data-i18n="auth.onboardTitle"></h1>
      <p class="muted" data-i18n="auth.onboardDesc"></p>
      <p id="who" class="chip"></p>
      <div class="form-grid">
        <label class="field-label" for="code" data-i18n="auth.studentCode"></label>
        <input id="code" inputmode="text" autocomplete="off" maxlength="12" aria-describedby="code-hint code-err">
        <small id="code-hint" class="muted" data-i18n="auth.studentCodeHint"></small>
        <div id="code-err" class="field-error" role="alert"></div>

        <label class="field-label" for="phone" data-i18n="auth.phone"></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" aria-describedby="phone-hint phone-err">
        <small id="phone-hint" class="muted" data-i18n="auth.phoneHint"></small>
        <div id="phone-err" class="field-error" role="alert"></div>

        <label class="field-label" style="display:flex;gap:10px;align-items:flex-start">
          <input id="ev" type="checkbox" style="min-height:24px;width:24px;margin-top:2px">
          <span><b data-i18n="auth.addEv"></b><br><span class="muted" data-i18n="auth.addEvDesc"></span></span>
        </label>
      </div>
      <button type="button" id="save" style="width:100%;margin-top:18px" data-i18n="auth.finish"></button>
      <div id="form-err" class="field-error" role="alert"></div>
    </section>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    const s = Hub.init();
    const $ = id => document.getElementById(id);
    if (s) {
      document.getElementById('who').textContent = Hub.t('auth.signedInAs', { name: s.full_name });
      API.get('/api/me').then(me => { $('code').value = me.student_code || ''; $('phone').value = me.phone || ''; }).catch(() => {});
      document.addEventListener('langchange', () => $('who').textContent = Hub.t('auth.signedInAs', { name: s.full_name }));
    }
    $('save').onclick = async () => {
      ['code-err', 'phone-err', 'form-err'].forEach(i => $(i).textContent = '');
      const code = $('code').value.trim(), phone = $('phone').value.trim();
      if (!/^[A-Za-z0-9]{6,12}$/.test(code)) { $('code-err').textContent = Hub.t('auth.invalidCode'); $('code').focus(); return; }
      if (phone && !/^\+?[0-9 ]{9,13}$/.test(phone)) { $('phone-err').textContent = Hub.t('auth.invalidPhone'); $('phone').focus(); return; }
      $('save').disabled = true; $('step2').classList.add('done');
      try {
        await API.patch('/api/me', { student_code: code, phone, onboarded: true });
        await API.refreshProfile();
        Hub.toast(Hub.t('auth.saved'), 'ok');
        location.href = $('ev').checked ? '/app/student/charging-vehicles.html' : '/app/student/find-hub.html';
      } catch (e) {
        $('step2').classList.remove('done'); $('save').disabled = false;
        if (e.status === 409) { $('code-err').textContent = Hub.t('auth.codeTaken'); $('code').focus(); }
        else if (e.status === 422) $('code-err').textContent = Hub.t('auth.invalidCode');
        else $('form-err').textContent = e.message;
      }
    };
  </script>
</body>
</html>
