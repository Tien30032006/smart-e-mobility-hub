<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="page.chargingOps.title">Charging Stations & Scheduling</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
</head>
<body data-role="operator">
  <!-- OWNER: Member 2 + Member 3   USE CASES: UC-CH-07, UC-CH-08, UC-CH-09, UC-OP08, UC-OP09
       TODO: Per-point charging status, change status (CH-08), run prioritization (CH-09), view queue + priority scores, manual override (OP09). Shared page: two members collaborate here.
       Rules: keep <nav id="nav"> and the shared scripts (i18n.js in <head>, api-client.js, main.js); call Hub.init() first;
       show API results with Hub.render(el, promise, draw) and build the DOM inside draw() so it re-renders on language change.
       All visible text must use data-i18n keys / Hub.t() - add keys to BOTH languages in /shared/i18n.js.
       Put page-specific CSS/JS in this file only. -->
  <nav id="nav"></nav>
  <main>
    <header class="page-head">
      <h1 data-i18n="page.chargingOps.title">Charging Stations & Scheduling</h1>
      <p class="muted" data-i18n="page.chargingOps.desc"></p>
      <div class="chips">
        <span class="chip"><span><span data-i18n="common.owner"></span>: Member 2 + Member 3</span></span>
        <span class="chip"><span><span data-i18n="common.useCases"></span>: UC-CH-07, UC-CH-08, UC-CH-09, UC-OP08, UC-OP09</span></span>
      </div>
    </header>
    <div id="app" class="card"></div>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();
    // TODO(Member 2): replace this placeholder with the real UI for UC-CH-07, UC-CH-08, UC-CH-09, UC-OP08, UC-OP09.
    Hub.render(document.getElementById('app'), API.get('/api/charging/points'), data => {
      document.getElementById('app').innerHTML = '<p class="muted">' + Hub.esc(Hub.t('common.pending')) + '</p><pre>' + Hub.esc(JSON.stringify(data, null, 2)) + '</pre>';
    });
  </script>
</body>
</html>
