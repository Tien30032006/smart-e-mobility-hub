<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="page.whatIf.title">What-if Simulation</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .scenario-intro{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;margin:0 0 18px;border:1px solid var(--line);border-radius:16px;background:var(--brand-soft)}
    .scenario-intro b{display:block;margin-bottom:4px}.scenario-intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .simulation-container{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.5fr);gap:18px;align-items:start}
    .scenario-config{padding:20px}.scenario-config h2{margin:0 0 5px}.scenario-config>.muted{margin:0 0 16px;font-size:13px}
    #template-select{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    .scenario-cards{display:grid;gap:9px;margin:12px 0 20px}
    .scenario-card{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
    .scenario-card:hover,.scenario-card.selected{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 13%,transparent);background:var(--brand-soft)}
    .scenario-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--surface-2);color:var(--brand-strong);font-weight:800}
    .scenario-card b,.scenario-card small{display:block}.scenario-card small{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.35}
    .scenario-card .scenario-arrow{color:var(--muted)}
    .scenario-divider{height:1px;margin:20px 0;border:0;background:var(--line)}
    .form-group{margin-bottom:13px}.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
    .form-group select,.form-group input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
    .parameter-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    .btn-run{width:100%;min-height:46px;padding:12px;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);border-radius:12px;font-weight:750;cursor:pointer}.btn-run:disabled{opacity:.55;cursor:not-allowed}
    .snapshot-card{padding:20px}.snapshot-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.snapshot-head h2{margin:0 0 4px}.snapshot-badge{white-space:nowrap}
    .snapshot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
    .snapshot-metric{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}.snapshot-metric b{display:block;font-size:22px}.snapshot-metric small{color:var(--muted)}
    .snapshot-map{display:grid;place-items:center;min-height:170px;margin-top:12px;border:1px dashed var(--line);border-radius:15px;background:linear-gradient(135deg,var(--surface-2),var(--brand-soft));color:var(--muted);text-align:center}
    .snapshot-map strong{display:block;color:var(--ink);font-size:17px}.results-section{display:none;grid-column:1/-1;min-width:0;padding:20px}.results-section.active{display:block}
    .results-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.results-head h2{margin:0 0 5px}.btn-export{padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);cursor:pointer}
    .impact-pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--brand-soft);font-size:13px;font-weight:750}.impact-high{color:var(--danger);background:var(--danger-soft)}.impact-medium{color:var(--warn);background:var(--warn-soft)}.impact-low{color:var(--brand-strong)}
    .result-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:18px 0}.result-kpi{padding:14px;border:1px solid var(--line);border-radius:14px}.result-kpi small{display:block;color:var(--muted)}.result-kpi b{display:block;margin:5px 0;font-size:24px;font-variant-numeric:tabular-nums}
    .results-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:18px}.chart-container{position:relative;width:100%;height:280px;margin:10px 0 18px}.rec-card{padding:14px;margin:10px 0;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;background:var(--surface-2)}.rec-card.redistribute{border-left-color:var(--warn)}.rec-card.reschedule{border-left-color:var(--danger)}
    @media(max-width:900px){.simulation-container{grid-template-columns:1fr}.results-section{grid-column:auto}}
    @media(max-width:620px){.scenario-config,.snapshot-card,.results-section{padding:16px}.snapshot-grid,.result-kpis{grid-template-columns:1fr}.results-grid{grid-template-columns:1fr}.results-head{flex-direction:column}.btn-export{width:100%}.parameter-grid{grid-template-columns:1fr}}
  </style>
</head>
<body data-role="operator">
  <nav id="nav"></nav>
  <main>
    <header class="page-head"><p class="eyebrow" data-i18n="ops.breadcrumb"></p><h1 data-i18n="page.whatIf.title">What-if Simulation</h1><p class="muted" data-i18n="page.whatIf.desc"></p></header>
    <section class="scenario-intro"><span class="badge" data-i18n="whatif.snapshotBadge"></span><div><b data-i18n="whatif.snapshotTitle"></b><p data-i18n="whatif.snapshotHelp"></p></div></section>

    <div class="simulation-container">
      
      <!-- Left Column: Configuration (UC1, UC2) -->
      <aside class="card scenario-config">
        <h2 data-i18n="whatif.selectTemplate">Select Scenario Template</h2><p class="muted" data-i18n="whatif.templateHelp"></p>
        <div id="scenario-cards" class="scenario-cards"></div>
        <div class="form-group" aria-hidden="true">
          <select id="template-select">
            <option value="" data-i18n="whatif.loadingTemplates">Loading templates...</option>
          </select>
        </div>

        <hr class="scenario-divider">

        <h2 data-i18n="whatif.customParams">Scenario Parameters</h2>
        <form id="sim-form">
          <input type="hidden" id="param-kind" value="demand_surge">
          <div class="form-group">
            <label for="param-hub" data-i18n="whatif.hubId">Hub cần mô phỏng</label>
            <select id="param-hub" required></select>
          </div>
          <div class="parameter-grid"><div class="form-group">
            <label for="param-surge" data-i18n="whatif.surgeFactor">Demand Surge Factor</label>
            <input type="number" id="param-surge" step="0.1" min="1.0" value="1.5">
          </div><div class="form-group">
            <label for="param-failed" data-i18n="whatif.failedPoints">Số trạm sạc ngừng hoạt động</label>
            <input type="number" id="param-failed" step="1" min="0" value="0">
          </div></div>
          <div class="form-group">
            <label for="param-duration" data-i18n="whatif.duration">Thời lượng (phút)</label>
            <input type="number" id="param-duration" value="60" min="15" step="15" required>
          </div>
          
          <button type="submit" id="btn-run" class="btn-run" data-i18n="whatif.runBtn">Run Simulation</button>
          <div id="sim-status" class="muted" style="margin-top: 0.5rem; display: none;" data-i18n="whatif.running"></div>
        </form>
      </aside>

      <!-- Right Column: Results (UC5, UC6, UC7) -->
      <section class="card snapshot-card" id="network-snapshot"><div class="snapshot-head"><div><h2 data-i18n="whatif.networkSnapshot"></h2><p class="muted" data-i18n="whatif.snapshotReadOnly"></p></div><span class="badge snapshot-badge" id="snapshot-hub-name"></span></div><div class="snapshot-grid" id="snapshot-metrics"></div><div class="snapshot-map"><div><strong id="snapshot-focus"></strong><span data-i18n="whatif.snapshotMapHint"></span></div></div></section>
      <section id="results-view" class="card results-section">
        <div class="results-head"><div><h2 data-i18n="whatif.results">Simulation Results</h2><p class="muted" data-i18n="whatif.resultHelp"></p></div><button id="btn-export" class="btn-export" data-i18n="whatif.exportBtn" style="display: none;">Export Excel</button></div>
        
        <p style="font-size:1rem;margin:12px 0"><span data-i18n="whatif.impactLevel"></span> <span id="res-impact" class="impact-pill impact-low">---</span></p>
        <div class="result-kpis" id="result-kpis"></div>
        <div class="results-grid"><section><h3 data-i18n="whatif.kpis"></h3><div class="chart-container">
          <canvas id="kpiChart"></canvas>
        </div><div id="metrics-table" class="tablewrap"></div></section><section><h3 data-i18n="whatif.recommendations">Rebalancing Recommendations</h3><div id="recs-container">
          <!-- Recommendations injected here -->
        </div></section></div>
      </section>

    </div>
  </main>

  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    let currentResultId = null, currentResult = null, currentRecommendations = [];
    let kpiChart = null;
    let availableTemplates = [];

    // Initialize the Hub (sets up nav, etc.)
    Hub.init();

    // 1. Load Data on Startup
    async function initData() {
      try {
        // Load Hubs for the dropdown
        const hubs = await API.get('/api/hubs');
        const hubSelect = document.getElementById('param-hub');
        hubSelect.innerHTML = '';
        hubs.forEach(h => {
          const opt = document.createElement('option');
          opt.value = h.hub_id;
          opt.textContent = I18n.hubName(h);
          hubSelect.appendChild(opt);
        });
        function updateSnapshot() {
          const hub = hubs.find(item => item.hub_id === hubSelect.value) || hubs[0];
          if (!hub) return;
          document.getElementById('snapshot-hub-name').textContent = I18n.hubName(hub);
          document.getElementById('snapshot-focus').textContent = I18n.hubName(hub);
          document.getElementById('snapshot-metrics').innerHTML = [
            [I18n.t('whatif.snapshotVehicles'), hub.vehicles_available ?? '—'],
            [I18n.t('whatif.snapshotSpaces'), hub.free_spaces ?? '—'],
            [I18n.t('whatif.snapshotPorts'), hub.charging_points_free ?? '—']
          ].map(([label,value]) => `<div class="snapshot-metric"><b>${Hub.esc(value)}</b><small>${Hub.esc(label)}</small></div>`).join('');
        }
        hubSelect.addEventListener('change', updateSnapshot); updateSnapshot();

        // Load Templates (UC2)
        availableTemplates = await API.get('/api/simulation/templates');
        const tplSelect = document.getElementById('template-select');
        tplSelect.innerHTML = `<option value="">${I18n.t('whatif.customTemplate')}</option>`;
        availableTemplates.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          tplSelect.appendChild(opt);
        });
        const cards = document.getElementById('scenario-cards');
        const templateLabel = t => {
          const key = 'whatif.template.' + String(t.id || '').replace(/[^a-z0-9_]/gi, '');
          return I18n.t(key) === key ? t.name : I18n.t(key);
        };
        const templateHint = t => I18n.t('whatif.templateHint.' + t.id) === 'whatif.templateHint.' + t.id ? I18n.t('whatif.templateHint.default') : I18n.t('whatif.templateHint.' + t.id);
        cards.innerHTML = availableTemplates.map((t,i) => `<button type="button" class="scenario-card ${i === 0 ? 'selected' : ''}" data-template="${Hub.esc(t.id)}"><span class="scenario-icon">${i === 0 ? '↗' : i === 1 ? '⚡' : '◉'}</span><span><b>${Hub.esc(templateLabel(t))}</b><small>${Hub.esc(templateHint(t))}</small></span><span class="scenario-arrow">›</span></button>`).join('');
        cards.querySelectorAll('[data-template]').forEach(card => card.onclick = () => { tplSelect.value = card.dataset.template; tplSelect.dispatchEvent(new Event('change')); cards.querySelectorAll('.scenario-card').forEach(item => item.classList.toggle('selected', item === card)); });

        // Event listener for template selection
        tplSelect.onchange = (e) => {
          const selected = availableTemplates.find(t => t.id === e.target.value);
          if (selected) {
            document.getElementById('param-kind').value = selected.type;
            if(selected.hub_id) document.getElementById('param-hub').value = selected.hub_id;
            if(selected.surge_factor) document.getElementById('param-surge').value = selected.surge_factor;
            if(selected.failed_points !== undefined) document.getElementById('param-failed').value = selected.failed_points;
            if (cards) cards.querySelectorAll('.scenario-card').forEach(card => card.classList.toggle('selected', card.dataset.template === selected.id));
            hubSelect.dispatchEvent(new Event('change'));
          }
        };
        if (availableTemplates.length) { tplSelect.value = availableTemplates[0].id; tplSelect.dispatchEvent(new Event('change')); }

      } catch (err) {
        console.error("Failed to load initial data:", err);
      }
    }

    // 2. Handle Form Submission (UC1, UC3)
    document.getElementById('sim-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-run');
      const status = document.getElementById('sim-status');
      btn.disabled = true;
      status.style.display = 'block';
      document.getElementById('results-view').classList.remove('active');

      try {
        // Prepare scenario payload (UC1)
        const payload = {
          kind: document.getElementById('param-kind').value,
          params: {
            hub_id: document.getElementById('param-hub').value,
            duration_minutes: parseInt(document.getElementById('param-duration').value, 10),
            surge_factor: parseFloat(document.getElementById('param-surge').value),
            failed_points: parseInt(document.getElementById('param-failed').value, 10)
          },
          description: "Manual run from UI"
        };

        const templateId = document.getElementById('template-select').value;
        if (templateId) {
          payload.template_id = templateId;
        }

        // Create Scenario
        const scenario = await API.post('/api/simulation/scenarios', payload);
        
        // Run Simulation (UC3)
        const result = await API.post(`/api/simulation/scenarios/${scenario.scenario_id}/run`);
        currentResultId = result.result_id;

        // Fetch Recommendations (UC6)
        const recs = await API.get(`/api/simulation/results/${currentResultId}/recommendations`);

        // Render Results
        renderResults(result, recs);

      } catch (err) {
        alert(I18n.t('whatif.error') + (err.message || I18n.t('whatif.unknownError')));
        if(err.todo) console.warn("Missing Backend Impl:", err.todo);
      } finally {
        btn.disabled = false;
        status.style.display = 'none';
      }
    });

    // 3. Render Results (UC5, UC6)
    function renderResults(result, recommendations) {
      currentResult = result;
      currentRecommendations = recommendations || [];
      document.getElementById('results-view').classList.add('active');
      document.getElementById('btn-export').style.display = 'inline-block';

      // Impact Level
      const impactEl = document.getElementById('res-impact');
      impactEl.textContent = result.impact_level;
      impactEl.className = 'impact-pill impact-' + result.impact_level.toLowerCase();

      const values = Object.values(result.metrics || {});
      const mean = values.length ? values.reduce((sum,m) => sum + Number(m.fulfillment_rate_percent || 0), 0) / values.length : 0;
      const peak = values.length ? Math.max(...values.map(m => Number(m.peak_utilization || 0))) * 100 : 0;
      const unmet = values.reduce((sum,m) => sum + Number(m.unserved_demand_count || 0), 0);
      document.getElementById('result-kpis').innerHTML = [
        [I18n.t('whatif.kpiFulfillment'), mean.toFixed(1) + '%'],
        [I18n.t('whatif.kpiUnserved'), unmet],
        [I18n.t('whatif.kpiPeak'), peak.toFixed(1) + '%']
      ].map(([label,value]) => `<article class="result-kpi"><small>${Hub.esc(label)}</small><b>${Hub.esc(value)}</b></article>`).join('');
      document.getElementById('metrics-table').innerHTML = `<table><thead><tr><th>${I18n.t('whatif.tableHub')}</th><th>${I18n.t('whatif.kpiFulfillment')}</th><th>${I18n.t('whatif.kpiUnserved')}</th><th>${I18n.t('whatif.kpiPeak')}</th></tr></thead><tbody>${Object.entries(result.metrics || {}).map(([id,m]) => `<tr><td>${Hub.esc(I18n.hubName({id}))}</td><td>${Number(m.fulfillment_rate_percent || 0).toFixed(1)}%</td><td>${Number(m.unserved_demand_count || 0)}</td><td>${(Number(m.peak_utilization || 0)*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`;

      // Render Chart (UC5)
      renderChart(result.metrics);

      // Render Recommendations (UC6)
      const container = document.getElementById('recs-container');
      container.innerHTML = '';

      if (!recommendations || recommendations.length === 0) {
        container.innerHTML = `<p class="muted">${I18n.t('whatif.noRecs')}</p>`;
      } else {
        recommendations.forEach(rec => {
          const div = document.createElement('div');
          div.className = `rec-card ${rec.type === 'redistribute' ? 'redistribute' : rec.type === 'reschedule_charging' ? 'reschedule' : ''}`;
          
          let titleKey = 'whatif.rec.' + rec.type;
          let title = I18n.t(titleKey);
          
          let detailsHtml = '';
          if (rec.type === 'redistribute' || rec.type === 'redirect_users') {
             let moveText = I18n.t('whatif.rec.move', { from: I18n.hubName({id: rec.from_hub}), to: I18n.hubName({id: rec.to_hub}) });
             detailsHtml = `<strong>${moveText}</strong><br>`;
             if(rec.vehicle_ids) detailsHtml += `<small>${I18n.t('whatif.vehicles')}${rec.vehicle_ids.map(Hub.esc).join(', ')}</small><br>`;
          } else if (rec.type === 'reschedule_charging') {
             detailsHtml = `<strong>${I18n.t('whatif.hub')}${Hub.esc(I18n.hubName({id: rec.hub_id}))}</strong><br><small>${Hub.esc(rec.details || '')}</small><br>`;
          }

          const reasonKey = 'whatif.reason.' + rec.type;
          const reason = ['redistribute','redirect_users','reschedule_charging'].includes(rec.type)
            ? I18n.t(reasonKey, {from:I18n.hubName({id:rec.from_hub}),to:I18n.hubName({id:rec.to_hub})}) : rec.reason;
          div.innerHTML = `
            <h4 style="margin:0 0 0.5rem 0;">${title}</h4>
            ${detailsHtml}
            <p style="margin-top:0.5rem;" class="muted"><em>${I18n.t('whatif.rec.reason')} ${Hub.esc(reason || '')}</em></p>
          `;
          container.appendChild(div);
        });
      }
      
      // Re-apply translations for dynamically generated HTML
      I18n.apply(container);
    }

    // 4. Render Chart.js (UC5)
    function renderChart(metrics) {
      const ctx = document.getElementById('kpiChart').getContext('2d');
      if (kpiChart) kpiChart.destroy();

      const labels = Object.keys(metrics).map(id => I18n.hubName({id}));
      const fulfillmentData = Object.values(metrics).map(m => m.fulfillment_rate_percent);
      const utilizationData = Object.values(metrics).map(m => m.peak_utilization * 100);
      const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
      const warn = getComputedStyle(document.documentElement).getPropertyValue('--warn').trim();

      kpiChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: I18n.t('whatif.chartFulfillment'),
              data: fulfillmentData,
              backgroundColor: brand,
              borderColor: brand,
              borderWidth: 1
            },
            {
              label: I18n.t('whatif.chartUtilization'),
              data: utilizationData,
              backgroundColor: warn,
              borderColor: warn,
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100 }
          },
          plugins: {
            title: { display: false }
          }
        }
      });
    }

    // 5. Export Report (UC7)
    document.getElementById('btn-export').addEventListener('click', () => {
      if (!currentResultId) return;
      const s = API.session();
      const url = `/api/simulation/results/${currentResultId}/report?fmt=xlsx`;
      
      // We need to fetch and trigger download manually to pass the Auth token header
      fetch(url, { headers: { 'Authorization': 'Bearer ' + (s ? s.token : '') } })
      .then(res => {
        if(!res.ok) throw new Error(I18n.t('whatif.downloadFailed'));
        return res.blob();
      })
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `WhatIf_Report_${currentResultId}.xlsx`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
      })
      .catch(err => alert(I18n.t('whatif.downloadFailed') + ': ' + err.message));
    });

    // Re-render chart text if language changes
    document.addEventListener('langchange', () => {
       // Optional: Re-fetch or re-render elements that depend purely on JS
       initData();
       if (currentResult) renderResults(currentResult, currentRecommendations);
    });

    // Run on load
    initData();
  </script>
</body>
</html>
