<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="auth.resetTitle">Reset password</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <style>
    .reset-form button[type=submit] { width:100%; margin-top:12px; }
    .reset-form[hidden], [hidden] { display:none!important; }
    .reset-message:empty { display:none; }
  </style>
</head>
<body data-role="any">
  <nav id="nav"></nav>
  <main>
    <section class="card auth-card">
      <h1 data-i18n="auth.resetTitle">Reset password</h1>
      <p id="reset-desc" class="muted" data-i18n="auth.resetRequestDesc"></p>

      <form id="request-form" class="form-grid reset-form" novalidate>
        <label class="field-label" for="reset-email" data-i18n="auth.email">E-mail</label>
        <input id="reset-email" type="email" autocomplete="email" inputmode="email" required maxlength="200">
        <div id="request-error" class="field-error" role="alert"></div>
        <button type="submit" data-i18n="auth.resetRequestBtn">Send reset link</button>
      </form>

      <form id="complete-form" class="form-grid reset-form" hidden novalidate>
        <label class="field-label" for="new-password" data-i18n="auth.password">Password</label>
        <input id="new-password" type="password" autocomplete="new-password" maxlength="128" required>
        <small class="muted" data-i18n="auth.passwordHint"></small>
        <label class="field-label" for="confirm-password" data-i18n="auth.confirm">Confirm password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" required>
        <div id="complete-error" class="field-error" role="alert"></div>
        <button type="submit" data-i18n="auth.resetSubmitBtn">Set new password</button>
      </form>

      <p id="reset-message" class="muted reset-message" role="status" aria-live="polite"></p>
      <p style="margin-bottom:0"><a href="/app/login.html" data-i18n="auth.backToLogin">Back to sign in</a></p>
    </section>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();
    const $ = id => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token') || '';
    const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    const strongEnough = value => value.length >= 8 && /[A-Za-z]/.test(value) && /\d/.test(value);
    let resetEnabled = false;

    function translateInto(id, key) {
      const element = $(id);
      element.dataset.i18n = key;
      element.textContent = Hub.t(key);
    }

    function clearText(id) {
      const element = $(id);
      delete element.dataset.i18n;
      element.textContent = '';
    }

    function setBusy(form, busy) {
      const button = form.querySelector('button[type="submit"]');
      if (busy) {
        button.dataset.label = button.textContent;
        button.textContent = Hub.t('auth.working');
      } else {
        button.textContent = button.dataset.label || button.textContent;
        delete button.dataset.label;
      }
      button.disabled = busy;
    }

    $('request-form').onsubmit = async event => {
      event.preventDefault();
      clearText('request-error');
      clearText('reset-message');
      const email = $('reset-email').value.trim();
      if (!emailPattern.test(email)) {
        translateInto('request-error', 'auth.invalidEmail');
        $('reset-email').focus();
        return;
      }
      if (!resetEnabled) {
        translateInto('request-error', 'auth.resetUnavailable');
        return;
      }
      setBusy($('request-form'), true);
      try {
        await API.requestPasswordReset(email);
        $('request-form').hidden = true;
        translateInto('reset-message', 'auth.resetRequestSent');
      } catch (error) {
        translateInto('request-error', error.status === 503
          ? 'auth.resetUnavailable' : 'home.loginFailed');
      } finally {
        if (!$('request-form').hidden) setBusy($('request-form'), false);
      }
    };

    $('complete-form').onsubmit = async event => {
      event.preventDefault();
      clearText('complete-error');
      clearText('reset-message');
      const password = $('new-password').value;
      if (!strongEnough(password)) {
        translateInto('complete-error', 'auth.weakPassword');
        $('new-password').focus();
        return;
      }
      if (password !== $('confirm-password').value) {
        translateInto('complete-error', 'auth.mismatch');
        $('confirm-password').focus();
        return;
      }
      setBusy($('complete-form'), true);
      try {
        await API.completePasswordReset(token, password);
        history.replaceState(null, '', location.pathname);
        $('complete-form').hidden = true;
        translateInto('reset-message', 'auth.resetComplete');
      } catch (error) {
        translateInto('complete-error', error.status === 400
          ? 'auth.resetInvalidLink'
          : error.status === 422 ? 'auth.weakPassword' : 'home.loginFailed');
      } finally {
        if (!$('complete-form').hidden) setBusy($('complete-form'), false);
      }
    };

    (async () => {
      try {
        const config = await API.config();
        resetEnabled = Boolean(config.password_reset_enabled);
        if (token) {
          $('request-form').hidden = true;
          $('complete-form').hidden = false;
          translateInto('reset-desc', 'auth.resetNewPasswordDesc');
          $('new-password').focus();
          return;
        }
        if (!resetEnabled) {
          $('request-form').hidden = true;
          $('complete-form').hidden = true;
          translateInto('reset-message', 'auth.resetUnavailable');
          return;
        }
      } catch (_) {
        if (token) {
          $('request-form').hidden = true;
          $('complete-form').hidden = false;
          translateInto('reset-desc', 'auth.resetNewPasswordDesc');
        } else {
          $('request-form').hidden = true;
          $('complete-form').hidden = true;
          translateInto('reset-message', 'home.loginFailed');
        }
      }
    })();
  </script>
</body>
</html>
