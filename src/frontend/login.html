<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="auth.title">Sign in</title>
  <script src="/shared/i18n.js"></script>
  <link rel="stylesheet" href="/app/assets/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .form-grid button[type=submit] { margin-top: 14px; width: 100%; }
    .pw { display: flex; gap: 8px; } .pw input { flex: 1; min-width: 0; } .pw button { min-width: 64px; padding: 0 12px; }
    .field-error:empty { display: none; }
  </style>
</head>
<body data-role="any">
  <!-- Login: e-mail + password (sign in / register), Google Sign-In, and seeded demo accounts (DEMO_MODE only). -->
  <nav id="nav"></nav>
  <main>
    <section class="card auth-card">
      <h1 data-i18n="auth.title"></h1>
      <p class="muted" data-i18n="auth.subtitle"></p>

      <div class="seg full" role="group" id="tabs" style="margin-top:14px">
        <button type="button" id="tab-login" aria-pressed="true" data-i18n="auth.tabLogin"></button>
        <button type="button" id="tab-register" aria-pressed="false" data-i18n="auth.tabRegister"></button>
      </div>

      <form id="form-login" class="form-grid" novalidate>
        <label class="field-label" for="l-email" data-i18n="auth.email"></label>
        <input id="l-email" type="email" autocomplete="email" inputmode="email" required>
        <label class="field-label" for="l-pass" data-i18n="auth.password"></label>
        <div class="pw"><input id="l-pass" type="password" autocomplete="current-password" required>
          <button type="button" class="secondary toggle-pw" data-for="l-pass" data-i18n="auth.show"></button></div>
        <div id="l-err" class="field-error" role="alert"></div>
        <button type="submit" id="l-submit" data-i18n="auth.loginBtn"></button>
      </form>

      <form id="form-register" class="form-grid" hidden novalidate>
        <label class="field-label" for="r-name" data-i18n="auth.fullName"></label>
        <input id="r-name" type="text" autocomplete="name" maxlength="80" required>
        <label class="field-label" for="r-email" data-i18n="auth.email"></label>
        <input id="r-email" type="email" autocomplete="email" inputmode="email" required>
        <label class="field-label" for="r-pass" data-i18n="auth.password"></label>
        <div class="pw"><input id="r-pass" type="password" autocomplete="new-password" aria-describedby="r-hint" required>
          <button type="button" class="secondary toggle-pw" data-for="r-pass" data-i18n="auth.show"></button></div>
        <small id="r-hint" class="muted" data-i18n="auth.passwordHint"></small>
        <label class="field-label" for="r-pass2" data-i18n="auth.confirm"></label>
        <input id="r-pass2" type="password" autocomplete="new-password" required>
        <div id="r-err" class="field-error" role="alert"></div>
        <button type="submit" id="r-submit" data-i18n="auth.registerBtn"></button>
      </form>

      <div class="auth-or"><span data-i18n="auth.orGoogle"></span></div>
      <div id="google-btn" aria-live="polite" style="display:flex;justify-content:center;min-height:44px"></div>
      <div id="login-msg" class="field-error" role="alert"></div>

      <div id="demo-area" hidden>
        <div class="auth-or"><span data-i18n="auth.or"></span></div>
        <div class="roles" id="demo-list"></div>
      </div>
      <p id="demo-off" class="muted" hidden data-i18n="auth.demoOff"></p>
    </section>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();
    const msg = document.getElementById('login-msg');
    const params = new URLSearchParams(location.search);
    const safeNext = () => { const n = params.get('next'); return n && n.startsWith('/app/') && !n.includes('//') ? n : null; };
    const go = s => { location.href = (s.role === 'student' && s.onboarded === false) ? '/app/onboarding.html' : (safeNext() || API.homeFor(s)); };
    const fail = key => { msg.textContent = Hub.t(key); };

    if (API.session()) go(API.session());      // already signed in

    const $ = id => document.getElementById(id);
    const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    const strongEnough = p => p.length >= 8 && !/^\d+$/.test(p) && !/^[A-Za-z]+$/.test(p) && /[A-Za-z]/.test(p) && /\d/.test(p);

    /* tabs */
    function tab(reg) {
      $('form-login').hidden = reg; $('form-register').hidden = !reg;
      $('tab-login').setAttribute('aria-pressed', !reg); $('tab-register').setAttribute('aria-pressed', reg);
      ['l-err', 'r-err', 'login-msg'].forEach(i => $(i).textContent = '');
      history.replaceState(null, '', reg ? '#register' : location.pathname + location.search);
      ($(reg ? 'r-name' : 'l-email')).focus();
    }
    $('tab-login').onclick = () => tab(false);
    $('tab-register').onclick = () => tab(true);
    if (location.hash === '#register') tab(true);

    /* show / hide password */
    document.querySelectorAll('.toggle-pw').forEach(b => b.onclick = () => {
      const i = $(b.dataset.for), show = i.type === 'password';
      i.type = show ? 'text' : 'password'; b.textContent = Hub.t(show ? 'auth.hide' : 'auth.show');
    });
    document.addEventListener('langchange', () => document.querySelectorAll('.toggle-pw').forEach(b =>
      b.textContent = Hub.t($(b.dataset.for).type === 'password' ? 'auth.show' : 'auth.hide')));

    /* map server errors to localised text */
    function errText(e) {
      if (e.status === 401) return Hub.t('auth.wrongCreds');
      if (e.status === 409) return Hub.t('auth.emailTaken');
      if (e.status === 429) return Hub.t('auth.tooMany');
      if (e.status === 403) return /operator/i.test(e.message) ? Hub.t('auth.operatorGoogle') : Hub.t('auth.domain');
      return e.status ? e.message : Hub.t('home.loginFailed');
    }
    async function busy(btn, errEl, fn) {
      const label = btn.textContent; errEl.textContent = ''; btn.disabled = true; btn.textContent = Hub.t('auth.working');
      try { go(await fn()); } catch (e) { errEl.textContent = errText(e); btn.disabled = false; btn.textContent = label; }
    }

    $('form-login').onsubmit = ev => {
      ev.preventDefault();
      const email = $('l-email').value.trim(), pass = $('l-pass').value;
      if (!EMAIL.test(email)) { $('l-err').textContent = Hub.t('auth.invalidEmail'); $('l-email').focus(); return; }
      if (!pass) { $('l-err').textContent = Hub.t('auth.wrongCreds'); $('l-pass').focus(); return; }
      busy($('l-submit'), $('l-err'), () => API.loginPassword(email, pass));
    };

    $('form-register').onsubmit = ev => {
      ev.preventDefault();
      const name = $('r-name').value.trim(), email = $('r-email').value.trim(), p1 = $('r-pass').value, p2 = $('r-pass2').value, err = $('r-err');
      if (name.length < 2) { err.textContent = Hub.t('auth.nameRequired'); $('r-name').focus(); return; }
      if (!EMAIL.test(email)) { err.textContent = Hub.t('auth.invalidEmail'); $('r-email').focus(); return; }
      if (!strongEnough(p1)) { err.textContent = Hub.t('auth.weakPassword'); $('r-pass').focus(); return; }
      if (p1 !== p2) { err.textContent = Hub.t('auth.mismatch'); $('r-pass2').focus(); return; }
      busy($('r-submit'), err, () => API.register({ full_name: name, email, password: p1 }));
    };

    async function onGoogle(resp) {
      msg.textContent = '';
      try { go(await API.loginGoogle(resp.credential)); }
      catch (e) { e.status === 403 ? fail('auth.domain') : (msg.textContent = e.message || Hub.t('auth.googleFailed')); }
    }

    function mountGoogle(clientId, tries) {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: clientId, callback: onGoogle, ux_mode: 'popup' });
        google.accounts.id.renderButton(document.getElementById('google-btn'),
          { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: 320, locale: I18n.lang });
      } else if (tries > 0) setTimeout(() => mountGoogle(clientId, tries - 1), 300);
      else fail('auth.googleFailed');
    }

    (async () => {
      let cfg;
      try { cfg = await API.config(); } catch (e) { return fail('home.loginFailed'); }
      if (cfg.google_client_id) mountGoogle(cfg.google_client_id, 20); else fail('auth.googleMissing');
      if (cfg.demo_mode) {
        document.getElementById('demo-area').hidden = false;
        document.getElementById('demo-list').innerHTML = cfg.demo_accounts.map(a =>
          `<button type="button" class="role-card" data-email="${Hub.esc(a.email)}"><span class="ico">${Hub.icon(a.role === 'operator' ? 'shield' : (a.has_private_ev ? 'plug' : 'bike'))}</span>` +
          `<strong>${Hub.esc(a.full_name)}</strong><span class="d">${Hub.esc(a.email)}</span></button>`).join('');
        document.querySelectorAll('#demo-list button').forEach(b => b.onclick = async () => {
          b.disabled = true; msg.textContent = '';
          try { go(await API.login(b.dataset.email)); } catch (e) { msg.textContent = e.message || Hub.t('auth.loginFailed'); b.disabled = false; }
        });
      } else document.getElementById('demo-off').hidden = false;
    })();
  </script>
</body>
</html>
