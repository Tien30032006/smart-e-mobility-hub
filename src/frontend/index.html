<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart E-Mobility Hub</title>
  <link rel="stylesheet" href="/app/assets/css/style.css">
</head>
<body data-role="any">
  <!-- SHARED PAGE: login + live hub overview (proves frontend <-> backend wiring works). -->
  <nav id="nav"></nav>
  <main>
    <h1>Smart E-Mobility Hub</h1>
    <p class="muted">Electric mobility coordination system for the VNU-HCM Urban Area (MVP, simulated data)</p>

    <div class="card" id="login">
      <b>Demo login</b>
      <p class="muted">Pick one of the accounts defined in <code>configs/hubs-data.json</code>.</p>
      <button data-email="an@hcmut.edu.vn" data-go="student/find-hub.html">Student (shared vehicles)</button>
      <button data-email="binh@hcmut.edu.vn" data-go="student/find-hub.html">Student (owns a private EV)</button>
      <button class="secondary" data-email="operator@hub.vn" data-go="operator/dashboard.html">Operator</button>
    </div>

    <h2>Hub Overview</h2>
    <div id="app" class="grid"></div>
  </main>
  <script src="/shared/api-client.js"></script>
  <script src="/app/assets/js/main.js"></script>
  <script>
    Hub.init();
    document.querySelectorAll('#login button').forEach(b => b.onclick = async () => {
      await API.login(b.dataset.email); location.href = '/app/' + b.dataset.go;
    });
    Hub.render(document.getElementById('app'), API.get('/api/hubs'), hubs => {
      document.getElementById('app').innerHTML = hubs.map(h => `
        <div class="card"><b>${Hub.esc(h.name)}</b> <span class="badge ${h.near_capacity ? 'bad' : ''}">${Math.round(h.utilization*100)}% full</span>
          <div class="bar ${h.near_capacity ? 'hot' : ''}"><i style="width:${h.utilization*100}%"></i></div>
          <p class="muted">Free spaces ${h.free_spaces}/${h.capacity} · Vehicles available ${h.vehicles_available} · Free charging points ${h.charging_points_free}/${h.charging_points_total}</p></div>`).join('');
    });
  </script>
</body>
</html>
